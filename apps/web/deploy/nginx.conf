server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # 保留外部端口，避免重定向到容器内部 3000。
    absolute_redirect off;
    client_max_body_size 12m;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    location = / { return 302 /app-portfolio/; }
    location = /app-portfolio { return 301 /app-portfolio/; }

    location ^~ /app-portfolio/api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 60s;
    }

    location ^~ /app-portfolio/assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /app-portfolio/ {
        try_files $uri $uri/ /app-portfolio/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / { return 404; }
}
