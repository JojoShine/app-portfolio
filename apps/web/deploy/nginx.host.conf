# 宿主机 Nginx：将 dist 内容发布到 /var/www/app-portfolio。
# 若合并到现有站点，保留以下 location 并使用该站点的 listen/server_name。
server {
    listen 3200;
    server_name _;
    root /var/www;
    index index.html;
    absolute_redirect off;
    client_max_body_size 12m;

    location = /app-portfolio { return 301 /app-portfolio/; }
    location ^~ /app-portfolio/api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location ^~ /app-portfolio/assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /app-portfolio/ {
        try_files $uri $uri/ /app-portfolio/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location / { return 404; }
}
