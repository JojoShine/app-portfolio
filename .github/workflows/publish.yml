name: Check and publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: app_portfolio_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d app_portfolio_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci-only-password@127.0.0.1:5432/app_portfolio_ci
      JWT_SECRET: ci-only-jwt-secret-not-for-production-12345
      ENROLLMENT_DATA_KEY: ci-only-data-key-not-for-production-12345
      FILE_STORAGE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@8.9.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @app-portfolio/api prisma:generate
      - run: pnpm --filter @app-portfolio/api prisma:validate
      - run: pnpm --filter @app-portfolio/api db:migrate
      - name: Initialize isolated CI database (no cloud credentials)
        run: node apps/api/test-support/seed-ci.js
      - run: pnpm --filter @app-portfolio/api check
      - run: pnpm --filter @app-portfolio/api test
      - run: pnpm --filter @app-portfolio/web lint
      - run: node --test test/*.test.js
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        with:
          name: app-portfolio-web-${{ github.sha }}
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 14

  image:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/jojoshine/app-portfolio-api:${{ github.sha }}
            ghcr.io/jojoshine/app-portfolio-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
