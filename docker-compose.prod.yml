# 服务器只拉取 CI 发布的镜像，不在服务器构建。
services:
  api:
    image: ${API_IMAGE:?请指定 Actions 发布的 ghcr.io/jojoshine/app-portfolio-api:提交SHA}
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      ENABLE_DEV_AUTH: "false"
      DATABASE_URL: ${DATABASE_URL:?请配置外部 PostgreSQL 连接}
      JWT_SECRET: ${JWT_SECRET:?请配置正式 JWT_SECRET}
      ENROLLMENT_DATA_KEY: ${ENROLLMENT_DATA_KEY:?请配置数据加密密钥}
      TRUST_PROXY_HOPS: 1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:3000"
    stop_grace_period: 30s
