services:
  postgres:
    image: postgres:16.8-alpine
    container_name: app-portfolio-postgres
    profiles: ["local-db"]
    restart: unless-stopped
    command: postgres -c timezone=Asia/Shanghai
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app_portfolio}
      POSTGRES_USER: ${POSTGRES_USER:-app_portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_portfolio_local}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - app_portfolio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ${API_ENV_FILE:-./apps/api/.env}
    environment:
      NODE_ENV: production
      PORT: 8000
      ENABLE_DEV_AUTH: "false"
      RUN_INITIALIZATION: ${RUN_INITIALIZATION:-true}
      SEED_MODULES: ${SEED_MODULES:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

volumes:
  app_portfolio_postgres_data:
